<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="ui-monospace, monospace">
  <!--
    Image Noise-Converge Demo 静态示意图
    录制:在浏览器中打开 http://localhost:8080/demos/image-converge
          上传 / 拖入图片(或点预设 "Heart"),录 8s
    状态切换:idle (0s) → loading (0.5s) → noise (0.5-1s) → converge (1-2.5s) → hold (2.5-8s)
  -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#08081a"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5c7c"/>
      <stop offset="0.5" stop-color="#a8a3ff"/>
      <stop offset="1" stop-color="#7af7d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- 模拟字符雨(噪点) -->
  <g fill="#7af7d4" opacity="0.35" font-size="11" font-weight="bold">
    <text x="40"  y="50">0</text><text x="58"  y="50">8</text><text x="76"  y="50">3</text>
    <text x="40"  y="70">1</text><text x="58"  y="70">9</text><text x="76"  y="70">2</text>
    <text x="40"  y="90">5</text><text x="58"  y="90">7</text><text x="76"  y="90">0</text>
    <text x="40" y="110">2</text><text x="58" y="110">6</text><text x="76" y="110">4</text>
    <text x="40" y="130">9</text><text x="58" y="130">1</text><text x="76" y="130">3</text>
    <text x="40" y="150">4</text><text x="58" y="150">8</text><text x="76" y="150">7</text>
    <text x="40" y="170">6</text><text x="58" y="170">0</text><text x="76" y="170">5</text>
    <text x="40" y="190">1</text><text x="58" y="190">3</text><text x="76" y="190">9</text>
    <text x="40" y="210">7</text><text x="58" y="210">2</text><text x="76" y="210">8</text>
    <text x="40" y="230">5</text><text x="58" y="230">4</text><text x="76" y="230">1</text>
  </g>
  <g fill="#a8a3ff" opacity="0.3" font-size="11" font-weight="bold">
    <text x="820" y="60">9</text><text x="838" y="60">2</text><text x="856" y="60">7</text>
    <text x="820" y="80">3</text><text x="838" y="80">0</text><text x="856" y="80">5</text>
    <text x="820" y="100">8</text><text x="838" y="100">1</text><text x="856" y="100">6</text>
    <text x="820" y="120">4</text><text x="838" y="120">9</text><text x="856" y="120">3</text>
    <text x="820" y="140">7</text><text x="838" y="140">5</text><text x="856" y="140">0</text>
    <text x="820" y="160">2</text><text x="838" y="160">8</text><text x="856" y="160">1</text>
    <text x="820" y="180">6</text><text x="838" y="180">4</text><text x="856" y="180">9</text>
    <text x="820" y="200">1</text><text x="838" y="200">7</text><text x="856" y="200">3</text>
    <text x="820" y="220">5</text><text x="838" y="220">2</text><text x="856" y="220">8</text>
    <text x="820" y="240">9</text><text x="838" y="240">6</text><text x="856" y="240">4</text>
  </g>

  <!-- 中央 hold 阶段呈现的心形(锁定的字符组成图像) -->
  <g transform="translate(380,140)" fill="#7af7d4" filter="url(#glow)">
    <!-- 心形由字符 cell 构成(简化示意) -->
    <g font-size="13" font-weight="bold">
      <text x="40" y="20">X</text><text x="60" y="20">X</text><text x="80" y="20">.</text><text x="100" y="20">X</text><text x="120" y="20">X</text>
      <text x="20" y="40">X</text><text x="40" y="40">X</text><text x="60" y="40">X</text><text x="80" y="40">X</text><text x="100" y="40">X</text><text x="120" y="40">X</text><text x="140" y="40">X</text>
      <text x="20" y="60">.</text><text x="40" y="60">X</text><text x="60" y="60">X</text><text x="80" y="60">X</text><text x="100" y="60">X</text><text x="120" y="60">X</text><text x="140" y="60">.</text>
      <text x="40" y="80">.</text><text x="60" y="80">X</text><text x="80" y="80">X</text><text x="100" y="80">X</text><text x="120" y="80">.</text>
      <text x="60" y="100">.</text><text x="80" y="100">X</text><text x="100" y="100">.</text>
      <text x="80" y="120">.</text>
    </g>
  </g>

  <!-- phase 指示器(右上) -->
  <g transform="translate(740,30)">
    <rect width="200" height="80" fill="rgba(8,8,18,0.85)" stroke="rgba(255,92,124,0.35)" stroke-width="1" rx="8"/>
    <text x="16" y="22" fill="#aaa" font-size="10" letter-spacing="0.1em">CURRENT PHASE</text>
    <text x="16" y="50" fill="#7af7d4" font-size="20" font-weight="600" letter-spacing="0.04em">hold</text>
    <text x="16" y="68" fill="#888" font-size="10">t = 3.42s · 220/220 locked</text>
  </g>

  <!-- 进度条 -->
  <g transform="translate(40,440)">
    <rect width="880" height="4" fill="rgba(255,255,255,0.06)" rx="2"/>
    <rect width="616" height="4" fill="url(#progress)" rx="2"/>
  </g>

  <!-- 控制面板(底部) -->
  <g transform="translate(40,460)">
    <rect width="880" height="60" fill="rgba(20,20,40,0.65)" stroke="rgba(124,92,255,0.18)" rx="8"/>
    <text x="14" y="22" fill="rgba(0,229,255,0.9)" font-size="10" letter-spacing="0.08em">PRESET</text>
    <g font-size="10" font-weight="bold">
      <text x="14"  y="46" fill="#7af7d4">♥</text><text x="42"  y="46" fill="rgba(200,196,184,0.5)">★</text><text x="70" y="46" fill="rgba(200,196,184,0.5)">→</text><text x="98" y="46" fill="rgba(200,196,184,0.5)">☺</text>
    </g>
    <text x="160" y="22" fill="rgba(0,229,255,0.9)" font-size="10" letter-spacing="0.08em">PARAMS</text>
    <text x="160" y="42" fill="rgba(200,196,184,0.7)" font-size="10">noiseDuration 0.5s</text>
    <text x="160" y="58" fill="rgba(200,196,184,0.7)" font-size="10">convergeDuration 1.5s</text>
    <text x="360" y="42" fill="rgba(200,196,184,0.7)" font-size="10">noiseFadeInDuration 0.30s</text>
  </g>

  <!-- 标题 -->
  <text x="40" y="40" fill="rgba(255,92,124,0.9)" font-size="11" letter-spacing="0.12em">IMAGE EMERGENCE</text>
  <text x="40" y="76" fill="#fff" font-size="22" font-weight="600">图片噪声 → 收敛涌现</text>
</svg>
