<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<title>@xietuier/matrix-rain · Landing 实战</title>
<link rel="stylesheet" href="../../dist/fonts/fonts.css">
<link rel="stylesheet" href="../../dist/matrix-rain.css">
<style>
  html, body { margin: 0; min-height: 100vh; background: #0a0a14; }
  body { font-family: Inter, system-ui, sans-serif; }
  nav { position: relative; z-index: 6; display: flex; justify-content: space-between; align-items: center; padding: 20px 48px; }
  .logo { font-family: "Fraunces", serif; font-style: italic; font-size: 22px; color: rgb(240,236,223); }
  .nav-links { display: flex; gap: 32px; }
  .nav-links a { color: rgb(200,196,184); text-decoration: none; font-size: 14px; }
  .nav-links a:hover { color: rgb(0,229,255); }

  .hero { position: relative; z-index: 5; max-width: 1100px; margin: 0 auto; padding: 80px 48px 120px; }
  .badge { display: inline-block; font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .2em; padding: 6px 12px; border: 1px solid rgba(0,229,255,.4); border-radius: 999px; color: rgb(0,229,255); margin-bottom: 32px; }
  h1 { font-family: "Fraunces", serif; font-style: italic; font-size: 96px; line-height: 1.05; margin: 0 0 24px; color: rgb(240,236,223); }
  h1 em { font-style: italic; background: linear-gradient(95deg, rgb(255,77,109) 0%, rgb(255,138,61) 22%, rgb(255,210,63) 44%, rgb(46,213,115) 62%, rgb(0,229,255) 80%, rgb(124,92,255) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { font-size: 20px; line-height: 1.5; color: rgb(200,196,184); max-width: 700px; margin: 0 0 48px; }
  .cta { display: flex; gap: 16px; }
  .btn { padding: 14px 28px; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; display: inline-block; font-family: inherit; }
  .btn-primary { background: linear-gradient(135deg, rgb(0,229,255), rgb(124,92,255)); color: #000; }
  .btn-secondary { background: transparent; color: rgb(240,236,223); border: 1px solid rgba(240,236,223,.3); }
  .btn-primary:hover { transform: translateY(-2px); }
  .btn-secondary:hover { border-color: rgba(0,229,255,.5); }

  .meta { position: fixed; bottom: 24px; right: 24px; z-index: 6; font-family: "JetBrains Mono", monospace; font-size: 11px; color: rgba(200,196,184,.6); letter-spacing: .1em; }
  @media (max-width: 700px) {
    nav { padding: 16px 20px; }
    .nav-links { gap: 16px; }
    .nav-links a { font-size: 13px; }
    .hero { padding: 32px 20px 80px; }
    .badge { font-size: 10px; margin-bottom: 20px; }
    h1 { font-size: 48px; line-height: 1.1; }
    .sub { font-size: 16px; line-height: 1.55; margin-bottom: 32px; }
    .cta { flex-direction: column; gap: 12px; }
    .btn { padding: 12px 20px; font-size: 14px; text-align: center; }
    .meta { bottom: 16px; right: 16px; font-size: 10px; }
  }
</style>
</head>
<body>
<nav>
  <div class="logo">硅 谷 大 蟹</div>
  <div class="nav-links">
    <a href="#">产品</a><a href="#">方案</a><a href="#">文档</a><a href="#">定价</a>
    <a href="#" style="color:rgb(0,229,255)">登录</a>
  </div>
</nav>

<section class="hero">
  <span class="badge">硅 谷 风 · AI 助理</span>
  <h1>老大身边那个<br><em>勤快、有活</em><br>的 AI 助理</h1>
  <p class="sub">飞书 DM 全天候在岗。股市小弟 · 飞书文档助手 · 定时任务执行者 · 看板 / 选股 / 复盘 流水线。</p>
  <div class="cta">
    <a href="#" class="btn btn-primary">立即体验 →</a>
    <a href="#" class="btn btn-secondary">看看能干啥</a>
  </div>
</section>

<div class="meta">硅 谷 大 蟹 · 2026</div>

<script type="module">
import { matrixRain, MatrixRain } from '../../dist/index.js?v=0.1.0';
matrixRain({ theme: 'silicon-valley', fontSize: 14, trailAlpha: 0.18 });

// 跨页面/关闭时自动清理
window.addEventListener('pagehide', () => MatrixRain.destroyAll());
window.addEventListener('beforeunload', () => MatrixRain.destroyAll());
</script>
</body>
</html>
