<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<title>@xietuier/matrix-rain · 5 主题对比</title>
<link rel="stylesheet" href="../dist/matrix-rain.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; }
  h1 { position: relative; z-index: 5; font-family: "Fraunces", serif; font-style: italic; font-size: 48px; color: rgb(240,236,223); text-align: center; padding: 32px 16px 0; margin: 0; }
  .subtitle { position: relative; z-index: 5; text-align: center; color: rgb(200,196,184); margin: 8px 0 24px; font-size: 14px; }
  .grid { position: relative; z-index: 5; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
  .cell { position: relative; height: 320px; border-radius: 16px; overflow: hidden; border: 1px solid rgba(124,92,255,.25); }
  .cell canvas { position: absolute !important; inset: 0; }
  .label { position: absolute; bottom: 16px; left: 16px; z-index: 6; font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: .15em; padding: 6px 12px; background: rgba(0,0,0,.4); backdrop-filter: blur(8px); border-radius: 6px; color: rgb(240,236,223); text-transform: uppercase; }
  .name-cn { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
  .name-en { font-size: 10px; opacity: .6; }
  @media (max-width: 700px) {
    h1 { font-size: 32px; padding: 20px 16px 0; }
    .subtitle { font-size: 13px; margin: 6px 12px 16px; }
    .grid { grid-template-columns: 1fr; gap: 12px; padding: 12px; }
    .cell { height: 240px; }
  }
</style>
</head>
<body>
<h1>5 主题 · 同一经典变体</h1>
<p class="subtitle">silicon-valley · matrix-green · lava-red · cyber-blue · pure-mono</p>
<div class="grid" id="grid"></div>

<script type="module">
import { matrixRain, themes } from '../dist/index.js?v=0.1.0';

const themes_ = [
  { id: 'silicon-valley', name: '硅 谷',  desc: '默认 · 冷青+暖琥珀' },
  { id: 'matrix-green',   name: '黑 客',  desc: 'matrix-green' },
  { id: 'lava-red',       name: '熔 岩',  desc: 'lava-red' },
  { id: 'cyber-blue',     name: '赛 博',  desc: 'cyber-blue' },
  { id: 'pure-mono',      name: '单 色',  desc: 'pure-mono' },
];

const grid = document.getElementById('grid');
themes_.forEach(t => {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.innerHTML = `<div class="label"><div class="name-cn">${t.name}</div><div class="name-en">${t.id}</div></div>`;
  grid.appendChild(cell);

  matrixRain({
    container: cell,
    theme: t.id,
    fontSize: 16,
    trailAlpha: 0.15
  });
});
</script>
</body>
</html>
