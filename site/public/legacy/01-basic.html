<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<title>@xietuier/matrix-rain · 演示</title>
<link rel="stylesheet" href="../dist/matrix-rain.css">
<style>
  body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif; }
  main { position: relative; z-index: 5; max-width: 800px; margin: 0 auto; padding: 80px 24px; }
  h1 { font-family: "Fraunces", "Cormorant Garamond", serif; font-style: italic; font-size: 72px; margin: 0 0 16px; color: rgb(240,236,223); }
  p { color: rgb(200, 196, 184); font-size: 16px; line-height: 1.65; }
  .controls { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; background: rgba(16,16,26,.85); padding: 12px; border-radius: 12px; backdrop-filter: blur(10px); border: 1px solid rgba(124,92,255,.3); }
  .controls button { background: transparent; color: rgb(240,236,223); border: 1px solid rgba(124,92,255,.4); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px; }
  .controls button:hover { background: rgba(124,92,255,.2); }
  .controls button.active { background: linear-gradient(135deg, rgb(0,229,255), rgb(124,92,255)); color: #000; border-color: transparent; }
  @media (max-width: 700px) {
    main { padding: 40px 20px 120px; }
    h1 { font-size: 44px; }
    p { font-size: 14px; }
    .controls { bottom: 12px; left: 12px; right: 12px; transform: none; flex-wrap: wrap; justify-content: center; padding: 8px; }
    .controls button { padding: 8px 10px; font-size: 12px; }
  }
</style>
</head>
<body>
  <main>
    <h1>数字雨 · 演示</h1>
    <p>右下角 5 个主题可切换。试试 <strong style="color:rgb(0,229,255)">cyber-blue</strong> 和 <strong style="color:rgb(255,77,109)">lava-red</strong>。</p>
    <p>页脚还有 4 种变体可玩。</p>
  </main>

  <div class="controls">
    <button class="theme-btn active" data-theme="silicon-valley">硅 谷</button>
    <button class="theme-btn" data-theme="matrix-green">黑 客</button>
    <button class="theme-btn" data-theme="lava-red">熔 岩</button>
    <button class="theme-btn" data-theme="cyber-blue">赛 博</button>
    <button class="theme-btn" data-theme="pure-mono">单 色</button>
  </div>

  <div class="controls" style="bottom: 80px;">
    <button class="variant-btn active" data-variant="classic">classic</button>
    <button class="variant-btn" data-variant="avalanche">avalanche</button>
    <button class="variant-btn" data-variant="ripple">ripple</button>
    <button class="variant-btn" data-variant="ascii">ascii</button>
  </div>

  <script type="module">
    import { matrixRain } from '../dist/index.js?v=0.1.0';
    let rain = matrixRain({ theme: 'silicon-valley', variant: 'classic' });

    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        rain.setTheme(btn.dataset.theme);
      });
    });

    document.querySelectorAll('.variant-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        rain.destroy();
        rain = matrixRain({ theme: document.querySelector('.theme-btn.active').dataset.theme, variant: btn.dataset.variant });
      });
    });
  </script>
</body>
</html>
