<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@xietuier/matrix-rain · 10-element Web Component Demo</title>
<meta name="description" content="10 个 <matrix-rain> 元素 · 验证 Web Component 多实例稳定性">
<link rel="stylesheet" href="../dist/matrix-rain.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; background: #0a0a14; font-family: "Inter", system-ui, sans-serif; color: #e6e3d6; }
  header { position: relative; z-index: 10; padding: 32px 48px 16px; }
  header h1 { margin: 0 0 6px; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  header h1 em { font-style: normal; background: linear-gradient(95deg, #00e5ff, #7c5cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { margin: 0; color: rgba(230, 227, 214, 0.65); font-size: 14px; }
  .toolbar { position: relative; z-index: 10; padding: 12px 48px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .toolbar button { background: rgba(0, 229, 255, 0.1); border: 1px solid rgba(0, 229, 255, 0.35); color: #00e5ff; padding: 6px 14px; border-radius: 6px; font-family: "JetBrains Mono", monospace; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .toolbar button:hover { background: rgba(0, 229, 255, 0.2); }
  .toolbar select { background: rgba(16, 16, 26, 0.85); border: 1px solid rgba(124, 92, 255, 0.35); color: #e6e3d6; padding: 6px 10px; border-radius: 6px; font-family: "JetBrains Mono", monospace; font-size: 12px; }
  .grid { position: relative; z-index: 5; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; padding: 24px 48px 64px; max-width: 1400px; margin: 0 auto; }
  .cell { position: relative; aspect-ratio: 4 / 3; border: 1px solid rgba(124, 92, 255, 0.25); border-radius: 12px; overflow: hidden; background: #0a0a14; }
  .cell .label { position: absolute; top: 10px; left: 10px; z-index: 5; font-family: "JetBrains Mono", monospace; font-size: 11px; color: rgba(255, 255, 255, 0.75); background: rgba(0, 0, 0, 0.55); padding: 4px 8px; border-radius: 4px; pointer-events: none; }
  .cell .label .theme { color: #00e5ff; }
  .cell .label .fps { color: rgba(255, 255, 255, 0.5); margin-left: 8px; }
  matrix-rain { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>

<header>
  <h1><em>10-Element</em> Web Component Demo</h1>
  <p>同一页面 10 个独立 <code>&lt;matrix-rain&gt;</code> 元素,每实例独立主题/变体/字号/字符集,验证矩阵雨实例化稳定性。</p>
</header>

<div class="toolbar">
  <button onclick="window.__addOne()">+ Add 1</button>
  <button onclick="window.__destroyAll()">Destroy All</button>
  <label style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(230,227,214,0.65);">Bulk Theme:
    <select id="bulk-theme" onchange="window.__bulkTheme(this.value)">
      <option value="silicon-valley">silicon-valley</option>
      <option value="matrix-green">matrix-green</option>
      <option value="lava-red">lava-red</option>
      <option value="cyber-blue">cyber-blue</option>
      <option value="pure-mono">pure-mono</option>
    </select>
  </label>
  <span id="counter" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(0,229,255,0.85);">10 inst · avg 0 fps</span>
</div>

<div class="grid" id="grid"></div>

<script type="module">
import { matrixRain, mountFpsOverlay, MatrixRainElement } from '../dist/index.js?v=10';

// 自动注册 <matrix-rain> 标签
if (!customElements.get('matrix-rain')) {
  customElements.define('matrix-rain', MatrixRainElement);
}

const themes = ['silicon-valley', 'matrix-green', 'lava-red', 'cyber-blue', 'pure-mono'];
const variants = ['classic', 'avalanche', 'ripple', 'ascii'];
const charsets = ['0123456789', '01', 'アァカサタナハマヤラワABCDEF', '01アイウエオカキクケコ'];

let counter = 0;

function mkCell(i) {
  const wrap = document.createElement('div');
  wrap.className = 'cell';
  const theme = themes[i % themes.length];
  const variant = variants[i % variants.length];
  const fontSize = 12 + (i % 4) * 2;
  const charset = charsets[i % charsets.length];

  const label = document.createElement('div');
  label.className = 'label';
  label.innerHTML = `<span class="theme">${theme}</span> · ${variant} · ${fontSize}px <span class="fps">— fps</span>`;
  wrap.appendChild(label);

  const el = document.createElement('matrix-rain');
  el.setAttribute('theme', theme);
  el.setAttribute('variant', variant);
  el.setAttribute('font-size', String(fontSize));
  el.setAttribute('charset', charset);
  wrap.appendChild(el);

  // 每 250ms 刷新 label 上的 FPS
  const upd = setInterval(() => {
    const inst = el.instance;
    if (!inst) { clearInterval(upd); return; }
    const fps = inst.getFPS();
    label.querySelector('.fps').textContent = `${fps} fps`;
  }, 250);

  return wrap;
}

const grid = document.getElementById('grid');
for (let i = 0; i < 10; i++) {
  grid.appendChild(mkCell(i));
  counter++;
}
updateCounter();

// 全局工具
window.__addOne = () => {
  grid.appendChild(mkCell(counter++));
  updateCounter();
};
window.__destroyAll = () => {
  document.querySelectorAll('matrix-rain').forEach(el => el.destroy());
  grid.innerHTML = '';
  counter = 0;
  updateCounter();
};
window.__bulkTheme = (theme) => {
  document.querySelectorAll('matrix-rain').forEach(el => el.setAttribute('theme', theme));
};

function updateCounter() {
  const dbg = window.__matrixRainDebug;
  document.getElementById('counter').textContent =
    `${counter} cells · ${dbg?.count ?? '?'} inst · avg ${dbg?.avgFps ?? '?'} fps`;
}

// 启动角标
mountFpsOverlay();
setInterval(updateCounter, 500);
</script>
</body>
</html>
