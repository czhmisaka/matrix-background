<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@xietuier/matrix-rain · CDN (IIFE) Demo</title>
<meta name="description" content="用 <script src> 引入 IIFE 产物测试 CDN 用法 · 无需构建工具">
<link rel="stylesheet" href="../dist/matrix-rain.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; background: #0a0a14; font-family: "Inter", system-ui, sans-serif; color: #e6e3d6; }
  .wrap { position: relative; z-index: 5; max-width: 900px; margin: 0 auto; padding: 80px 32px 100px; }
  h1 { margin: 0 0 8px; font-size: 48px; font-weight: 600; letter-spacing: -0.02em; }
  h1 em { font-style: normal; background: linear-gradient(95deg, #00e5ff, #7c5cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.lead { color: rgba(230, 227, 214, 0.75); font-size: 17px; line-height: 1.6; max-width: 600px; }
  .info { margin-top: 32px; padding: 16px 20px; border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 8px; background: rgba(0, 229, 255, 0.06); font-family: "JetBrains Mono", monospace; font-size: 13px; }
  .info code { color: #00e5ff; }
  .actions { margin-top: 24px; display: flex; gap: 10px; flex-wrap: wrap; }
  .actions button { background: rgba(124, 92, 255, 0.15); border: 1px solid rgba(124, 92, 255, 0.4); color: #c5b8ff; padding: 8px 16px; border-radius: 6px; font-family: "JetBrains Mono", monospace; font-size: 12px; cursor: pointer; }
  .actions button:hover { background: rgba(124, 92, 255, 0.25); }
  .crumbs { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .15em; color: rgba(200,196,184,.6); text-transform: uppercase; margin-bottom: 16px; }
  .crumbs a { color: #00e5ff; text-decoration: none; }
</style>
</head>
<body>

<div class="wrap">
  <div class="crumbs"><a href="../">@xietuier/matrix-rain</a> / <a href="00-index.html">All Demos</a> / CDN · IIFE</div>
  <h1>CDN · <em>IIFE</em></h1>
  <p class="lead">
    本页用 <code>&lt;script src&gt;</code> 引入 IIFE 产物,验证浏览器原生标签即用 · 无需 npm / bundler / build。
  </p>

  <div class="info">
    window.MatrixRain = { matrixRain, themes, ... }<br>
    已挂载: <span id="status">checking…</span>
  </div>

  <div class="actions">
    <button onclick="window.MatrixRain.matrixRain({ theme: 'silicon-valley' })">+ silicon-valley</button>
    <button onclick="window.MatrixRain.matrixRain({ theme: 'matrix-green' })">+ matrix-green</button>
    <button onclick="window.MatrixRain.matrixRain({ theme: 'lava-red' })">+ lava-red</button>
    <button onclick="window.MatrixRain.matrixRain({ theme: 'cyber-blue' })">+ cyber-blue</button>
    <button onclick="window.MatrixRain.matrixRain({ theme: 'pure-mono' })">+ pure-mono</button>
    <button onclick="window.MatrixRain.MatrixRain.destroyAll()">× destroyAll</button>
  </div>
</div>

<!-- IIFE 引入:浏览器全局变量 window.MatrixRain -->
<script src="../dist/index.iife.js?v=0.1.0"></script>
<script>
  document.getElementById('status').innerHTML =
    '✅ window.MatrixRain = ' + Object.keys(window.MatrixRain).slice(0, 6).join(', ') + '…';

  // 默认启动一个
  if (window.MatrixRain && window.MatrixRain.matrixRain) {
    window.MatrixRain.matrixRain({ theme: 'silicon-valley' });
  } else {
    document.getElementById('status').innerHTML = '❌ IIFE 加载失败';
  }
</script>
</body>
</html>
